--[[
# ==============================================================================
# Widget: Okami System Identity
# Font: Okami (Brush)
# Designed for: Linux Mint / Cinnamon / X11
# ==============================================================================
]]

-- -----------------------------------------------------------------------------
-- USER CUSTOMIZATION SETTINGS
-- Edit these variables to easily customize the widget
-- -----------------------------------------------------------------------------
local default_left   = "LONE"       -- Word on the left (raised slightly)
local default_right  = "WOLF"       -- Word on the right (lowered slightly)
local font_size      = 64           -- Base font size (in pixels)
local default_style  = "katana"     -- "katana" (layered slash over right word)
                                    -- "clean"  (slash placed between words)
                                    -- "none"   (clean text without slash)

-- -----------------------------------------------------------------------------
-- RESOLVE DYNAMIC PREFERENCES (Files / Environment Variables)
-- -----------------------------------------------------------------------------
local home = os.getenv("HOME") or ""
local text_left  = os.getenv("OKAMI_SYSTEM_LEFT")
local text_right = os.getenv("OKAMI_SYSTEM_RIGHT")

if not text_left or text_left == "" then
    local f = io.open(home .. "/.config/conky/system.text", "r")
    if f then
        local line = f:read("*l")
        if line and line:match("%S") then
            local w1, w2 = line:match("(%S+)%s+(%S+)")
            if w1 and w2 then
                text_left = w1
                text_right = w2
            end
        end
        f:close()
    end
end

text_left  = (text_left and text_left ~= "") and text_left or default_left
text_right = (text_right and text_right ~= "") and text_right or default_right

local slash_style = os.getenv("OKAMI_SYSTEM_STYLE")
if not slash_style or slash_style == "" then
    local f = io.open(home .. "/.config/conky/system.style", "r")
    if f then
        local line = f:read("*l")
        if line and line:match("%S") then
            slash_style = line:match("^%s*(.-)%s*$")
        end
        f:close()
    end
end
slash_style = (slash_style and slash_style ~= "") and slash_style:lower() or default_style

-- -----------------------------------------------------------------------------
-- AUTOMATED GEOMETRY & OFFSET ENGINE
-- All offsets, font sizes, and kerning are computed automatically!
-- -----------------------------------------------------------------------------
local scale = font_size / 64.0
local slash_size = math.floor(font_size * 1.7 + 0.5)

-- Vertical offsets
local v_lone  = -math.floor(7 * scale + 0.5)
local v_wolf  =  math.floor(17 * scale + 0.5)
local v_slash = -math.floor(41 * scale + 0.5)

-- Okami font character width table (at 64px base)
local char_widths = {
    A=34.5, B=31.3, C=28.3, D=31.8, E=28.7, F=30.9, G=31.2, H=28.6, I=11.2,
    J=22.0, K=28.1, L=30.6, M=38.8, N=27.6, O=26.5, P=29.1, Q=30.4, R=27.7,
    S=34.2, T=24.6, U=24.9, V=27.4, W=36.6, X=28.1, Y=25.8, Z=30.9
}

local w_right = 0
for c in text_right:upper():gmatch(".") do
    w_right = w_right + (char_widths[c] or 28.8) * scale
end
local slash_jump = -math.floor(w_right + 17.4 * scale + 0.5)
local first_right = text_right:upper():sub(1, 1)
local wolf_offset_val = (first_right == 'W') and 4 or -2
local wolf_offset = math.floor(wolf_offset_val * scale + 0.5)

conky.config = {
    -- Window Positioning & Geometry
    alignment = 'top_middle',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 10,
    minimum_height = 10,
    maximum_width = 500,

    -- Update Timing
    update_interval = 2.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & XFT Font Rendering
    use_xft = true,
    font = 'Okami:size=8',
    xftalpha = 1.0,
    uppercase = false,
    override_utf8_locale = true,

    -- Cinnamon / X11 Window Management
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 0, -- 0 for 100% transparent background

    -- Graphics & Buffering
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Color Palette
    default_color = 'FFFFFF',
    color1 = 'E63946',  -- Accent: Japanese Crimson / Vermilion
    color2 = 'F5F5F7',  -- Primary: Clean Off-White
    color3 = '8D99AE',  -- Muted: Slate Grey
};

if slash_style == 'katana' then
    conky.text = string.format([[
${offset 27}${voffset -10}${color2}${font Okami:pixelsize=%d}${voffset %d}%s${offset %d}${voffset %d}%s${offset %d}${voffset %d}${color1}${font Okami:pixelsize=%d}/${font}
]], font_size, v_lone, text_left, wolf_offset, v_wolf, text_right, slash_jump, v_slash, slash_size)
elseif slash_style == 'clean' then
    local v_clean = math.floor(14 * scale + 0.5)
    local v_clean_wolf = math.floor(21 * scale + 0.5)
    conky.text = string.format([[
${offset 27}${voffset -10}${color2}${font Okami:pixelsize=%d}${voffset %d}%s${offset -12}${voffset -%d}${color1}${font Okami:pixelsize=%d}/${offset -12}${voffset %d}${color2}${font Okami:pixelsize=%d}%s${font}
]], font_size, v_lone, text_left, v_clean, slash_size, v_clean_wolf, font_size, text_right)
else -- 'none'
    conky.text = string.format([[
${offset 27}${voffset -10}${color2}${font Okami:pixelsize=%d}%s %s${font}
]], font_size, text_left, text_right)
end
