--[[
# ==============================================================================
# Widget: Okami System Stats (CPU, RAM, Disk)
# Font: Okami (Brush)
# Designed for: Linux Mint / Cinnamon / X11
# ==============================================================================
]]

conky.config = {
    -- Window Positioning & Geometry
    alignment = 'bottom_left',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 165,
    minimum_height = 130,
    maximum_width = 175,

    -- Update Timing
    update_interval = 1.5,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & XFT Font Rendering
    use_xft = true,
    font = 'Okami:size=10',
    xftalpha = 1.0,
    uppercase = false,
    override_utf8_locale = true,

    -- Cinnamon / X11 Window Management
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 0, -- 100% transparent background

    -- Graphics & Buffering
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Color Palette
    default_color = 'FFFFFF',
    color1 = 'E63946',  -- Accent: Japanese Crimson / Vermilion
    color2 = 'F5F5F7',  -- Primary: Clean Off-White
    color3 = '8D99AE',  -- Muted: Slate Grey

    -- Default bar dimensions
    default_bar_width = 85,
    default_bar_height = 4,
};

conky.text = [[
${color1}${font Okami:size=13}CPU${font}${goto 36}${color2}${font Okami:size=13}${cpu cpu0}%${font}${goto 74}${voffset 3}${color1}${cpubar 4,85}${voffset -3}
${voffset 2}${color1}${font Okami:size=13}RAM${font}${goto 36}${color2}${font Okami:size=13}${memperc}%${font}${goto 74}${voffset 3}${color1}${membar 4,85}${voffset -3}
${voffset 2}${color1}${font Okami:size=13}DISK${font}${goto 36}${color2}${font Okami:size=13}${fs_used_perc /}%${font}${goto 74}${voffset 3}${color1}${fs_bar 4,85 /}${voffset -3}
${voffset 4}${color3}${font Okami:size=10}UPTIME:${font}${offset 8}${color2}${font Okami:size=10}${uptime_short}${font}
]];
