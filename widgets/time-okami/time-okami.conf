--[[
# ==============================================================================
# Widget: Okami Minimal Time (Inline Layout)
# Font: Okami (Brush)
# Designed for: Linux Mint / Cinnamon / X11
# ==============================================================================
]]

conky.config = {
    -- Window Positioning & Geometry
    alignment = 'top_left',
    gap_x = 40,
    gap_y = 0,
    minimum_width = 520,
    minimum_height = 720,
    maximum_width = 620,

    -- Update Timing
    update_interval = 1.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & XFT Font Rendering
    use_xft = true,
    font = 'Okami:size=8',
    xftalpha = 1.0,
    uppercase = false,
    override_utf8_locale = true,

    -- Cinnamon / X11 Window Management
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 0, -- 0 for 100% transparent background

    -- Graphics & Buffering
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Color Palette
    default_color = 'FFFFFF',
    color1 = 'E63946',  -- Accent: Japanese Crimson / Vermilion
    color2 = 'F5F5F7',  -- Primary: Clean Off-White
    color3 = '8D99AE',  -- Muted: Slate Grey (Separators & Subtitles)

    -- Cairo Lua Scripting (Rotated Day Accent)
    lua_load = os.getenv("HOME") .. '/.config/conky/okami-rotate.lua',
    lua_draw_hook_post = 'conky_draw_rotated_day',
};

conky.text = [[
${voffset -65}${offset 24}${color2}${font Okami:size=120}${time %I:%M}${voffset -15}${color1}${font Okami:size=30} ${time %p}${voffset 15}${font}
${voffset -8}${offset 16}${color3}${font Okami:size=28}${time %B}${font}
${voffset 2}${lua_parse date_column}
]];
