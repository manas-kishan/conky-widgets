--[[
# ==============================================================================
# Widget: Okami Stacked Time (Vertical Modern Layout)
# Font: Okami (Brush)
# Designed for: Linux Mint / Cinnamon / X11
# ==============================================================================
]]

conky.config = {
    -- Window Positioning & Geometry
    alignment = 'top_left',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 240,
    minimum_height = 280,
    maximum_width = 320,

    -- Update Timing
    update_interval = 1.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & XFT Font Rendering
    use_xft = true,
    font = 'Okami:size=14',
    xftalpha = 1.0,
    uppercase = false,
    override_utf8_locale = true,

    -- Cinnamon / X11 Window Management
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 0, -- 0 for 100% transparent background

    -- Graphics & Buffering
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Color Palette
    default_color = 'FFFFFF',
    color1 = 'E63946',  -- Accent: Japanese Crimson / Vermilion
    color2 = 'F5F5F7',  -- Primary: Clean Off-White
    color3 = '8D99AE',  -- Muted: Slate Grey (Separators & Subtitles)
};

conky.text = [[
${color2}${font Okami:size=84}${time %H}
${voffset -35}${color1}${time %M}${font}
${voffset 10}${color1}${font Okami:size=20}${time %A}${font}
${voffset 2}${color3}${font Okami:size=16}${time %d %B %Y}${font}
]];
