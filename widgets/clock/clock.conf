--[[
# ==============================================================================
# Widget: Okami Clock (Multi-Format)
# Font: Okami (Brush)
# Modes: 12h-horizontal (default), 12h-vertical, 24h-horizontal, 24h-vertical
# Designed for: Linux Mint / Cinnamon / X11
# ==============================================================================
]]

-- Resolve selected clock mode
local home = os.getenv("HOME") or ""
local mode = os.getenv("OKAMI_CLOCK_MODE")

if not mode or mode == "" then
    local mode_file = home .. "/.config/conky/clock.mode"
    local f = io.open(mode_file, "r")
    if not f then
        f = io.open(home .. "/.config/conky/clock-okami.mode", "r")
    end
    if f then
        local line = f:read("*l")
        if line and line:match("%S") then
            mode = line:match("^%s*(.-)%s*$")
        end
        f:close()
    end
end

if not mode or mode == "" then
    mode = "12h-horizontal" -- Default layout
end

mode = string.lower(mode)

-- Normalize mode aliases
if mode == "12h" or mode == "12h-h" or mode == "horizontal" or mode == "inline" then
    mode = "12h-horizontal"
elseif mode == "12h-v" or mode == "vertical" or mode == "stacked" or mode == "stacked-12h" then
    mode = "12h-vertical"
elseif mode == "24h" or mode == "24h-h" then
    mode = "24h-horizontal"
elseif mode == "24h-v" or mode == "stacked-24h" then
    mode = "24h-vertical"
end

local is_vertical = (mode == "12h-vertical" or mode == "24h-vertical")

-- Geometry based on orientation
local min_w, min_h, max_w
if is_vertical then
    min_w = 240
    min_h = 240
    max_w = 320
else
    min_w = 480
    min_h = 110
    max_w = 560
end

conky.config = {
    -- Window Positioning & Geometry
    alignment = 'top_left',
    gap_x = 40,
    gap_y = 0,
    minimum_width = min_w,
    minimum_height = min_h,
    maximum_width = max_w,

    -- Update Timing
    update_interval = 1.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & XFT Font Rendering
    use_xft = true,
    font = 'Okami:size=8',
    xftalpha = 1.0,
    uppercase = false,
    override_utf8_locale = true,

    -- Cinnamon / X11 Window Management
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 0, -- 0 for 100% transparent background

    -- Graphics & Buffering
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Color Palette
    default_color = 'FFFFFF',
    color1 = 'E63946',  -- Accent: Japanese Crimson / Vermilion
    color2 = 'F5F5F7',  -- Primary: Clean Off-White
    color3 = '8D99AE',  -- Muted: Slate Grey (Separators & Subtitles)
};

-- Format specific text template
if mode == "12h-vertical" then
    conky.text = [[
${voffset 20}${color2}${font Okami:size=84}${time %I}
${voffset -75}${color1}${time %M}${voffset -22}${font Okami:size=24} ${time %p}${font}
]];
elseif mode == "24h-vertical" then
    conky.text = [[
${voffset 20}${color2}${font Okami:size=84}${time %H}
${voffset -75}${color1}${time %M}${font}
]];
elseif mode == "24h-horizontal" then
    conky.text = [[
${voffset -65}${offset 24}${color2}${font Okami:size=120}${time %H:%M}${font}
]];
else -- Default: 12h-horizontal
    conky.text = [[
${voffset -65}${offset 24}${color2}${font Okami:size=120}${time %I:%M}${voffset -15}${color1}${font Okami:size=30} ${time %p}${voffset 15}${font}
]];
end
