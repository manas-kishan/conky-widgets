--[[
# ==============================================================================
# Widget: Okami Calendar
# Font: Okami (Brush)
# Modes: grid (default 7 numbers per row), vertical (single column)
# Designed for: Linux Mint / Cinnamon / X11
# ==============================================================================
]]

local home = os.getenv("HOME") or ""
local mode = os.getenv("OKAMI_CALENDAR_MODE")

if not mode or mode == "" then
    local mode_file = home .. "/.config/conky/calendar.mode"
    local f = io.open(mode_file, "r")
    if not f then
        f = io.open(home .. "/.config/conky/calendar-okami.mode", "r")
    end
    if f then
        local line = f:read("*l")
        if line and line:match("%S") then
            mode = line:match("^%s*(.-)%s*$")
        end
        f:close()
    end
end

-- Resolve Lua calendar script path
local lua_script = home .. '/.config/conky/okami-calendar.lua'
local f_lua = io.open(lua_script, "r")
if f_lua then
    f_lua:close()
else
    local repo_lua = "widgets/calendar/okami-calendar.lua"
    local f_repo = io.open(repo_lua, "r")
    if f_repo then
        f_repo:close()
        lua_script = repo_lua
    end
end

if not mode or mode == "" then
    mode = "grid"
end

mode = string.lower(mode)
local is_grid = (mode == "grid" or mode == "g" or mode == "horizontal" or mode == "h" or mode == "grid-7" or mode == "7" or mode == "row")
local min_h = is_grid and 240 or 600

conky.config = {
    -- Window Positioning & Geometry
    alignment = 'top_left',
    gap_x = 40,
    gap_y = 140,
    minimum_width = 380,
    minimum_height = min_h,
    maximum_width = 460,

    -- Update Timing
    update_interval = 1.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & XFT Font Rendering
    use_xft = true,
    font = 'Okami:size=8',
    xftalpha = 1.0,
    uppercase = false,
    override_utf8_locale = true,

    -- Cinnamon / X11 Window Management
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 0, -- 0 for 100% transparent background

    -- Graphics & Buffering
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- Color Palette
    default_color = 'FFFFFF',
    color1 = 'E63946',  -- Accent: Japanese Crimson / Vermilion
    color2 = 'F5F5F7',  -- Primary: Clean Off-White
    color3 = '8D99AE',  -- Muted: Slate Grey (Separators & Subtitles)

    -- Lua Scripting (Dynamic Calendar Dates)
    lua_load = lua_script,
};

if is_grid then
    conky.text = [[
${voffset -10}${offset 16}${color3}${font Okami:size=28}${time %B}  ${color2}/  ${color1}${time %A}${font}
${lua_parse calendar_grid}
]];
else
    conky.text = [[
${voffset -10}${offset 16}${color3}${font Okami:size=28}${time %B}  ${color2}/  ${color1}${time %A}${font}
${voffset 2}${lua_parse calendar_column}
]];
end
